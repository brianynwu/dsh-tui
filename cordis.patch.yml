# @brianynwu/dsh-tui — the interactive TUI, as a bundle patch layer over
# @deepseek-ai/dsh-base. A patch replaces the targeted row's whole `config`, so
# each overridden row below restates every key it owns. Later layers (the
# profile's cordis.patch.yml, $DSH_HOME/cordis.patch.yml, --patch overlays)
# re-patch any of these rows, which is where a deployment repoints the model
# route or the DeepSeek endpoint.

# ── base rows this surface overrides ────────────────────────────────────────

# `main` is the agent the TUI drives. Its exact session identity (fresh UUID or
# --resume) is provided by the tui-startup row through the
# configuredAgentIdentities slot; `inject` makes this row wait for it.
#
# NO hardcoded provider/model: the TUI shell COMPOSES with the host's model-provider
# plugin (high cohesion, loose coupling) rather than pinning a default here. `main`'s
# provider/model are supplied by the host through the `agent/request` waterfall (the
# loop blesses an options-empty agent bound entirely via that seam) and chosen at
# runtime by the in-TUI `/model` command. A deployment that wants a standalone default
# re-patches this row with provider/model in its own profile/overlay.
- id: agent-loop
  inject: [tuiStartup]
  config:
    agents:
      - id: main
        cwd: !!js process.cwd()

# Keep the persona to identity and behavior; tool plugins own tool guidance.
# The loop resolves {{model}} from this agent's configuration.
- id: system-prompt
  config:
    persona: |
      You are a coding agent powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and
      factual.

# Full thinking at max effort on every request. Key and endpoint stay
# unconfigured here: both resolve per request from the `llm-deepseek:`
# settings section, the credential store, and $DEEPSEEK_BASE_URL.
- id: llm-deepseek
  config:
    thinking: enabled
    reasoningEffort: max

# ── TUI-only rows ───────────────────────────────────────────────────────────

- insert:
    # Command-line intake and session identity for the rows above.
    - id: tui-startup
      name: '@brianynwu/dsh-tui/startup'

    # `@session` references in the composer.
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    # Durable projection checkpoints (the storage hub + json backend + domain
    # form, and the session-projection-cache over them) are provided by
    # @deepseek-ai/dsh-base as of 0.1.5-rc.2 with identical config
    # (storages root, backend json, writeEveryEvents 200 / writeIntervalMs 5000).
    # This surface no longer re-declares them: two loader entries with the same
    # id (`storage`, …) make the plugin loader refuse the tree at boot
    # ("duplicate loader entry id: storage"). `/resume` still reads titles from
    # the base-provided checkpoint row.

    # Terminal-multiplexer context, mounted only where a terminal exists.
    - id: tmux-context
      name: '@deepseek-ai/dsh-tmux-context'
      config:
        refreshIntervalMs: 900000

    # The keyboard-backed provider behind ask_user_question and the plan-mode
    # review, and the front door it renders inside.
    - id: tui-prompt
      name: '@brianynwu/dsh-tui/prompt'

    # The TUI renders exactly the agent the agent-loop row bound, so it reads
    # the same startup-owned identity rather than restating one.
    - id: tui
      name: '@brianynwu/dsh-tui'
      inject: [tuiStartup, permissionPresets]
      config:
        sessionId: !!js ctx.tuiStartup.sessionId
        showReasoning: true
        maxToolOutputLines: 6
        # Exit resume-hint: a launcher whose deployment resumes differently (a non-default DSH_HOME or session
        # root) exports DSH_TUI_RESUME_HINT to its own command; unset ⇒ the stock command (byte-identical to
        # the schema default). `{session}` is expanded by the renderer to the minted session id; an empty value
        # suppresses the line. Env seam (not a launcher --patch) because a tui-row --patch REPLACES this whole
        # config block. The whole `!!js` expression is YAML-DOUBLE-QUOTED: the literal contains `: ` (colon-space)
        # and `{`, which as a bare YAML plain scalar would parse as a nested mapping (resumeHint ⇒ an object ⇒
        # boot-time "expected string" — a real live-verify catch). js-yaml passes the resolved scalar to the
        # `!!js` tag, so quoting is transparent to evaluation. The literal MUST equal config.ts
        # DEFAULT_RESUME_HINT (test/resume-hint.test.ts guards).
        resumeHint: !!js "process.env.DSH_TUI_RESUME_HINT ?? 'To resume this session: dsh --profile tui --resume={session}'"

    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
